# Prefixes ('26.1.2_', 'common_', etc.) will be removed in the properties map.
# And in mods.toml or fabric.mod.json use props without prefixes.
# needed version will be resolved automatically

# 26.1 family (pinned baseline: 26.1.2)
26.1.2_minecraft_version=26.1.2
26.1.2_minecraft_version_range=[26.1.2]
26.1.2_neoforge_mod_version_range=[26.1.2.97,)
26.1.2_mod_loader=javafml
26.1.2_loader_version_range=[11,)

# 1.21.1 family
1.21.1_minecraft_version=1.21.1
1.21.1_minecraft_version_range=[1.21.1]
1.21.1_neoforge_mod_version_range=[21.1.250,)
1.21.1_mod_loader=javafml
1.21.1_loader_version_range=[4,)

## Common Mod Properties, that used by all leaf modules.

# common_mod_version - it was set by Gradle scripts, based on project version. see root gradle.properties

common_mod_id=compukters
common_mod_name=Compukters
common_mod_license=Apache-2.0
common_mod_group_id=ru.lazyhat.compukters
common_mod_authors=lazyhat
common_mod_description=Programmable computers for Minecraft: write Kotlin programs for them in an in-game IDE.
common_homepage_url=https://github.com/CertifiedBadIdeas/Compukters
